<h3>Angular auto complete drop down</h3>

<form class="form">
  <mat-form-field class="width">
    <input
      matInput
      placeholder="Country"
      aria-label="Country"
      [matAutocomplete]="auto"
      [formControl]="countryCtrl"
      required
    />
    <mat-autocomplete #auto="matAutocomplete">
      <mat-option
        *ngFor="let country of filteredCountry | async"
        [value]="country.name"
      >
        <span>{{ country.name }} | {{ country.code }}</span>
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</form>

<h3>Mutlselect</h3>
<mat-form-field>
  <mat-select
    (openedChange)="openedChange($event)"
    placeholder="Select"
    [formControl]="selectFormControl"
    multiple
  >
    <!-- <mat-select-trigger>
      {{ selectFormControl.value ? selectFormControl.value[0] : "" }}
      <span
        *ngIf="(selectFormControl.value || []).length > 1"
        class="additional-selection"
      >
        (+{{ (selectFormControl.value || []).length - 1 }}
        {{ (selectFormControl.value || []).length === 2 ? "other" : "others" }})
      </span>
    </mat-select-trigger> -->
    <mat-select-trigger>
      {{ (selectFormControl.value || []).join(", ") }}
    </mat-select-trigger>

    <div class="select-container">
      <mat-optgroup>
        <mat-form-field style="width: 100%">
          <input
            #search
            autocomplete="off"
            placeholder="Search"
            aria-label="Search"
            matInput
            [formControl]="searchTextboxControl"
          />
          <button
            [disableRipple]="true"
            *ngIf="search.value"
            matSuffix
            mat-icon-button
            aria-label="Clear"
            (click)="clearSearch($event)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </mat-optgroup>
      <mat-optgroup *ngIf="(filteredOptions | async)?.length === 0">
        <div>No results found!</div>
      </mat-optgroup>
      <mat-option
        (onSelectionChange)="selectionChange($event)"
        *ngFor="let option of filteredOptions | async"
        [value]="option"
      >
        {{ option }}
      </mat-option>
    </div>
  </mat-select>
</mat-form-field>
<div *ngIf="selectFormControl.value">
  {{ "You have choosen " + selectFormControl.value }}
</div>
