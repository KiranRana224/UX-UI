<mat-form-field appearance="fill" class="full-width">
  <mat-label>Select Items</mat-label>
  <mat-select
    [formControl]="selectedOptions"
    multiple
    panelClass="select-with-search"
    (selectionChange)="onSelectionChange()"
  >
    <mat-option class="search-option" disabled disableRipple>
      <input
        matInput
        [(ngModel)]="searchText"
        placeholder="Search..."
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
        class="search-input"
      />
    </mat-option>

    <mat-option
      *ngFor="let option of options"
      [value]="option.value"
      [style.display]="shouldShowOption(option) ? '' : 'none'"
    >
      {{ option.label }}
    </mat-option>
  </mat-select>
</mat-form-field>
